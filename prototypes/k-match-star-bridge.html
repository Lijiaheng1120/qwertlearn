<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QwertLearn 连连看原型 B · 星桥连线</title>
  <style>
    :root { --ink:#f7fbff; --muted:#b8c8e8; --navy:#101a3d; --panel:#182552; --blue:#6ec8ff; --violet:#8d7cff; --yellow:#ffe47e; --pink:#ff91bd; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 18%,rgba(115,153,255,.28),transparent 25%),radial-gradient(circle at 85% 80%,rgba(170,91,255,.2),transparent 30%),#0b1230;overflow-x:hidden} button,a{font:inherit}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:44px 44px;opacity:.2}.app{min-height:100vh;padding:18px 28px 30px}.topbar{max-width:1280px;min-height:68px;margin:auto;padding:10px 14px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:rgba(17,28,66,.83);box-shadow:0 18px 55px rgba(0,0,0,.28);backdrop-filter:blur(14px);position:relative;z-index:2}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,var(--yellow),#ffad64);font-size:23px}.switch{display:flex;gap:5px;padding:5px;border-radius:15px;background:rgba(255,255,255,.07)}.switch a{padding:8px 12px;border-radius:11px;color:#aab9db;text-decoration:none;font-size:12px;font-weight:850}.switch a.active{color:#101a3d;background:var(--yellow)}.close{border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px 14px;color:white;background:rgba(255,255,255,.08);font-weight:850}main{max-width:1160px;margin:18px auto 0;position:relative}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:13px}.eyebrow{margin:0 0 4px;color:#8ddcff;font-size:12px;font-weight:900;letter-spacing:1.5px}h1{margin:0;font-size:clamp(29px,4vw,43px);line-height:1.05;letter-spacing:-1.5px}.hero p:last-child{margin:8px 0 0;color:var(--muted);font-weight:650}.mission{display:flex;gap:13px;padding:10px 14px;border:1px solid rgba(255,255,255,.12);border-radius:17px;background:rgba(24,37,82,.75)}.mission span{display:grid;gap:2px;font-size:11px;color:var(--muted)}.mission b{color:white;font-size:15px}.game{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px}.board{min-height:610px;padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:30px;background:linear-gradient(145deg,rgba(27,43,95,.96),rgba(18,28,68,.96));box-shadow:0 25px 70px rgba(0,0,0,.36);position:relative;overflow:hidden}.planet{position:absolute;width:260px;height:260px;border-radius:50%;right:-95px;bottom:-100px;background:linear-gradient(145deg,#5e58c7,#9f65dc);box-shadow:0 0 0 22px rgba(142,106,236,.09)}.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}.level{padding:9px 13px;border-radius:999px;color:#0e1737;background:var(--yellow);font-size:12px;font-weight:950}.status{flex:1;text-align:center;color:#dce6ff;font-size:13px;font-weight:850}.score{font-size:13px;font-weight:900}.bridge{display:grid;grid-template-columns:1fr 130px 1fr;gap:10px;margin-top:23px;position:relative;z-index:2}.lane{display:grid;gap:12px}.lane-title{text-align:center;color:#91a8d9;font-size:11px;font-weight:900;letter-spacing:1.3px}.star-card{min-height:68px;padding:12px;border:1px solid rgba(147,191,255,.35);border-radius:18px;color:white;background:linear-gradient(145deg,rgba(55,80,148,.95),rgba(37,52,111,.95));box-shadow:0 8px 22px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.18);font-size:19px;font-weight:900;cursor:pointer;transition:.18s}.star-card.cn{background:linear-gradient(145deg,rgba(102,74,167,.95),rgba(61,45,124,.95));font-size:17px}.star-card:hover{transform:scale(1.025);border-color:var(--blue)}.star-card.selected{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,228,126,.18),0 0 28px rgba(255,228,126,.25)}.star-card.wrong{border-color:var(--pink);animation:pulse .35s}.star-card.matched{pointer-events:none;color:#14214b;background:var(--yellow);opacity:.18;transform:scale(.82)}@keyframes pulse{50%{transform:scale(.96)}}.space{display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:34px 0 8px}.space span{font-size:22px;filter:drop-shadow(0 0 8px #70d6ff)}.space i{width:2px;flex:1;max-height:45px;background:linear-gradient(transparent,#67cfff,transparent)}.reward-row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;margin-top:18px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(8,15,43,.35);position:relative;z-index:2}.reward-row span{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.07);filter:grayscale(1);opacity:.4}.reward-row span.on{filter:none;opacity:1;background:rgba(255,228,126,.14)}.side{padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:27px;background:rgba(24,37,82,.9);box-shadow:0 20px 55px rgba(0,0,0,.25)}.astronaut{height:156px;display:grid;place-items:center;border-radius:21px;background:radial-gradient(circle,#344f9d,#152554);font-size:70px}.side h2{margin:15px 0 7px;font-size:18px}.side p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650}.steps{display:grid;gap:8px;margin-top:17px}.steps button{display:flex;justify-content:space-between;padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:13px;color:#bdcbed;background:rgba(255,255,255,.04);font-size:12px;font-weight:850;cursor:pointer}.steps button.active{color:#14214b;background:var(--yellow)}.next{width:100%;margin-top:16px;padding:12px;border:0;border-radius:14px;color:#172044;background:linear-gradient(90deg,var(--blue),#b19aff);font-weight:950;cursor:pointer}.next:disabled{opacity:.35}.note{margin-top:12px;color:#91a8d9;font-size:11px;line-height:1.5}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:760px){.app{padding:10px}.topbar{padding:9px 11px}.brand span:last-child,.close{display:none}.switch a{padding:7px 8px;font-size:10px}.hero{display:block}.mission{margin-top:12px}.game{grid-template-columns:1fr}.side{order:-1;padding:10px}.astronaut,.side p,.side h2,.note{display:none}.steps{grid-template-columns:repeat(3,1fr);margin:0}.steps button{font-size:10px}.next{display:none}.board{min-height:690px;padding:12px}.bridge{grid-template-columns:1fr 36px 1fr;gap:5px}.star-card{min-height:62px;padding:8px 4px;font-size:15px}.star-card.cn{font-size:14px}.space span{font-size:15px}.hud{flex-wrap:wrap}.status{order:3;flex-basis:100%}}
  </style>
</head>
<body><div class="stars"></div><div class="app"><header class="topbar"><div class="brand"><span class="mark">🚀</span><span>QwertLearn</span></div><nav class="switch" aria-label="连连看原型切换"><a href="j-match-word-garden.html">A 词语花园</a><a class="active" href="k-match-star-bridge.html">B 星桥连线</a><a href="l-match-card-ruins.html">C 词卡秘境</a></nav><button class="close">返回冒险地图</button></header><main><section class="hero"><div><p class="eyebrow">原型 B · 空间探索 · 连线感最强</p><h1>星桥词义连线</h1><p>找到英文与中文伙伴，点亮星星之间的能量桥。</p></div><div class="mission"><span>当前星区<b id="zone">月光站</b></span><span>已点亮<b><i id="score">0</i> / <i id="total">4</i></b></span></div></section><section class="game"><div class="board"><span class="planet"></span><div class="hud"><span class="level" id="levelLabel">星区 1 · 4 对</span><span class="status" id="status" role="status" aria-live="polite">选择任意一颗词语星</span><span class="score">连击 <b id="combo">0</b></span></div><div class="bridge"><div class="lane"><div class="lane-title">英文星群</div><div class="lane" id="en"></div></div><div class="space" aria-hidden="true"><span>✦</span><i></i><span>✧</span><i></i><span>✦</span></div><div class="lane"><div class="lane-title">中文星群</div><div class="lane" id="cn"></div></div></div><div class="reward-row" id="rewards" aria-label="已点亮星星"></div></div><aside class="side"><div class="astronaut">🧑‍🚀</div><h2>选择星区难度</h2><p>越远的星区词卡越多，主题也会混合。错误只会断开当前连线，不扣已获得的星星。</p><div class="steps"><button class="active" data-level="0">1 月光站 <b>4 对</b></button><button data-level="1">2 行星环 <b>6 对</b></button><button data-level="2">3 星云区 <b>8 对</b></button></div><button class="next" id="next" disabled>飞往下一星区 →</button><div class="note">难度递进：单一主题 → 跨主题干扰 → 限时星桥。适合强调冒险和奖励感。</div></aside></section></main></div><script>
const pool=[['teacher','老师'],['morning','早晨'],['yellow','黄色'],['window','窗户'],['rabbit','兔子'],['library','图书馆'],['weather','天气'],['breakfast','早餐']];const counts=[4,6,8],names=['月光站','行星环','星云区'];let level=0,selected=null,matched=0,combo=0,lock=false;const q=s=>document.querySelector(s),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function render(){selected=null;matched=0;combo=0;lock=false;const pairs=pool.slice(0,counts[level]);q('#en').innerHTML=pairs.map((p,i)=>`<button class="star-card" data-side="en" data-id="${i}">${p[0]}</button>`).join('');q('#cn').innerHTML=shuffle(pairs.map((p,i)=>({v:p[1],i}))).map(x=>`<button class="star-card cn" data-side="cn" data-id="${x.i}">${x.v}</button>`).join('');q('#rewards').innerHTML=pairs.map(()=>'<span>⭐</span>').join('');q('#score').textContent=0;q('#total').textContent=counts[level];q('#combo').textContent=0;q('#zone').textContent=names[level];q('#levelLabel').textContent=`星区 ${level+1} · ${counts[level]} 对`;q('#status').textContent='选择任意一颗词语星';q('#next').disabled=true;document.querySelectorAll('.steps button').forEach((b,i)=>b.classList.toggle('active',i===level))}
function pick(card){if(lock||card.classList.contains('matched'))return;if(selected===card){card.classList.remove('selected');selected=null;return}card.classList.add('selected');if(!selected){selected=card;q('#status').textContent='现在选择另一侧的伙伴';return}if(selected.dataset.side===card.dataset.side){selected.classList.remove('selected');selected=card;q('#status').textContent='能量桥要连接两侧星群';return}lock=true;const first=selected;if(first.dataset.id===card.dataset.id){combo++;q('#combo').textContent=combo;q('#status').textContent='连接成功！获得一颗星 ⭐';setTimeout(()=>{first.classList.add('matched');card.classList.add('matched');matched++;q('#score').textContent=matched;q('#rewards').children[matched-1].classList.add('on');selected=null;lock=false;if(matched===counts[level]){q('#status').textContent='星区全部点亮！';q('#next').disabled=level===2}},320)}else{combo=0;q('#combo').textContent=0;first.classList.add('wrong');card.classList.add('wrong');q('#status').textContent='能量频率不同，再连一次';setTimeout(()=>{first.classList.remove('selected','wrong');card.classList.remove('selected','wrong');selected=null;lock=false},480)}}
q('.board').onclick=e=>{const c=e.target.closest('.star-card');if(c)pick(c)};document.querySelectorAll('.steps button').forEach((b,i)=>b.onclick=()=>{level=i;render()});q('#next').onclick=()=>{if(level<2){level++;render()}};render();</script></body></html>
