<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QwertLearn 连连看原型 A · 词语花园</title>
  <style>
    :root { --ink:#193c3c; --muted:#66817c; --cream:#fffdf4; --green:#2f9f68; --green2:#80c96b; --yellow:#ffd96d; --coral:#ff8d72; --line:#d9eadc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 8% 10%,#fff 0 5%,transparent 14%),linear-gradient(180deg,#dff6ff 0 37%,#e8f5cd 37% 100%); }
    button,a { font:inherit; }
    button { color:inherit; }
    .app { min-height:100vh; padding:18px 28px 32px; overflow:hidden; position:relative; }
    .cloud { position:fixed; width:150px; height:42px; border-radius:999px; background:rgba(255,255,255,.7); top:105px; left:6%; box-shadow:72px 12px 0 -8px rgba(255,255,255,.7); pointer-events:none; }
    .topbar { max-width:1280px; min-height:68px; margin:auto; padding:10px 14px 10px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; border:2px solid rgba(25,60,60,.08); border-radius:22px; background:rgba(255,253,244,.92); box-shadow:0 12px 35px rgba(36,91,72,.1); position:relative; z-index:2; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:900; font-size:20px; }
    .mark { width:43px; height:43px; display:grid; place-items:center; border-radius:14px; background:var(--yellow); font-size:23px; }
    .switch { display:flex; gap:5px; padding:5px; border-radius:15px; background:#edf4e9; }
    .switch a { padding:8px 12px; border-radius:11px; text-decoration:none; color:#668078; font-size:12px; font-weight:850; }
    .switch a.active { color:white; background:#247f55; }
    .close { border:0; border-radius:13px; padding:10px 14px; background:#eef6f4; font-weight:850; }
    main { max-width:1160px; margin:18px auto 0; position:relative; z-index:1; }
    .hero { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:13px; }
    .eyebrow { margin:0 0 4px; color:#247f55; font-size:12px; font-weight:900; letter-spacing:1.5px; }
    h1 { margin:0; font-size:clamp(29px,4vw,43px); letter-spacing:-1.5px; line-height:1.05; }
    .hero p:last-child { margin:8px 0 0; color:var(--muted); font-weight:650; }
    .level-pills { display:flex; gap:6px; padding:6px; border-radius:17px; background:rgba(255,253,244,.85); border:2px solid rgba(25,60,60,.07); }
    .level-pills button { border:0; min-width:76px; padding:9px 10px; border-radius:12px; background:transparent; color:#789087; font-size:12px; font-weight:900; cursor:pointer; }
    .level-pills button.active { color:#fff; background:var(--green); box-shadow:0 6px 14px rgba(47,159,104,.25); }
    .game { display:grid; grid-template-columns:220px minmax(0,1fr); gap:14px; }
    .side { padding:18px; border-radius:26px; background:rgba(255,253,244,.94); border:2px solid rgba(25,60,60,.08); box-shadow:0 15px 35px rgba(45,96,72,.1); }
    .mascot { height:146px; display:grid; place-items:center; border-radius:21px; background:linear-gradient(150deg,#d8f3d0,#fff4c4); position:relative; overflow:hidden; }
    .mascot::after { content:""; width:125px; height:35px; position:absolute; bottom:-9px; border-radius:50%; background:#6fbb65; }
    .bee { font-size:64px; filter:drop-shadow(0 10px 6px rgba(63,98,41,.12)); animation:float 2.1s ease-in-out infinite; }
    @keyframes float { 50% { transform:translateY(-7px) rotate(3deg); } }
    .side h2 { margin:15px 0 5px; font-size:17px; }
    .side p { margin:0; color:var(--muted); font-size:13px; line-height:1.55; font-weight:650; }
    .mini { display:grid; gap:8px; margin-top:16px; }
    .mini div { display:flex; justify-content:space-between; padding:10px 11px; border-radius:12px; background:#f1f6e9; font-size:12px; font-weight:800; }
    .board { min-height:565px; padding:17px 20px 20px; border-radius:30px; background:rgba(255,253,244,.96); border:3px solid rgba(25,60,60,.09); box-shadow:0 22px 55px rgba(45,96,72,.14); position:relative; overflow:hidden; }
    .board::before { content:""; position:absolute; inset:auto -7% -52px; height:135px; border-radius:50% 50% 0 0; background:#b9df91; opacity:.72; }
    .hud { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:14px; position:relative; z-index:1; }
    .progress { height:12px; border-radius:999px; background:#e2eee0; overflow:hidden; }
    .progress i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--green),#8bcf67); transition:width .3s ease; }
    .status { min-width:230px; text-align:center; padding:10px 15px; border-radius:999px; background:#fff5cf; font-size:13px; font-weight:900; }
    .count { text-align:right; font-size:13px; font-weight:900; }
    .columns { display:grid; grid-template-columns:1fr 94px 1fr; align-items:start; gap:14px; position:relative; z-index:1; }
    .column h3 { margin:0 0 9px; color:#668078; font-size:12px; letter-spacing:1.2px; text-align:center; }
    .cards { display:grid; gap:10px; }
    .word-card { width:100%; min-height:61px; padding:10px 15px; border:2px solid #e0e9de; border-radius:17px; background:#fff; box-shadow:0 7px 0 #e3eddf; cursor:pointer; font-weight:900; font-size:20px; transition:transform .16s,border-color .16s,opacity .25s; }
    .word-card.cn { font-size:18px; }
    .word-card:hover { transform:translateY(-2px); border-color:#8dc9a4; }
    .word-card.selected { color:#176643; border-color:var(--green); background:#e8f8e8; box-shadow:0 7px 0 #aed8b4; }
    .word-card.wrong { border-color:var(--coral); background:#fff0eb; animation:shake .25s; }
    .word-card.matched { pointer-events:none; opacity:0; transform:scale(.76); }
    @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .garden-path { display:grid; justify-items:center; gap:15px; padding-top:31px; color:#7da47b; }
    .garden-path i { width:13px; height:13px; border-radius:50%; background:#c4dfad; box-shadow:0 0 0 6px #edf5de; }
    .garden-path span { font-size:31px; opacity:.75; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; position:relative; z-index:1; }
    .tip { color:var(--muted); font-size:12px; font-weight:700; }
    .next { border:0; padding:12px 19px; border-radius:14px; color:#fff; background:#287f56; box-shadow:0 7px 0 #17653f; font-weight:900; cursor:pointer; }
    .next:disabled { opacity:.45; cursor:not-allowed; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    @media (max-width:760px) { .app{padding:10px}.topbar{padding:9px 11px}.brand span:last-child,.close{display:none}.switch a{padding:7px 8px;font-size:10px}.hero{display:block}.level-pills{margin-top:12px}.game{grid-template-columns:1fr}.side{display:none}.board{padding:13px;min-height:650px}.hud{grid-template-columns:1fr auto}.status{grid-column:1/-1;grid-row:1;min-width:0}.count{grid-column:2}.columns{grid-template-columns:1fr 28px 1fr;gap:6px}.word-card{min-height:59px;padding:8px 5px;font-size:16px}.word-card.cn{font-size:15px}.garden-path{padding-top:34px}.garden-path span{font-size:20px}.hero p:last-child{font-size:13px} }
  </style>
</head>
<body>
  <div class="app">
    <span class="cloud"></span>
    <header class="topbar">
      <div class="brand"><span class="mark">⌨️</span><span>QwertLearn</span></div>
      <nav class="switch" aria-label="连连看原型切换">
        <a class="active" href="j-match-word-garden.html">A 词语花园</a>
        <a href="k-match-star-bridge.html">B 星桥连线</a>
        <a href="l-match-card-ruins.html">C 词卡秘境</a>
      </nav>
      <button class="close">返回冒险地图</button>
    </header>
    <main>
      <section class="hero">
        <div><p class="eyebrow">原型 A · 清晰双列 · 推荐</p><h1>词语花园连连看</h1><p>先点英文，再点对应中文。配对成功，花园就会长出一朵新花。</p></div>
        <div class="level-pills" aria-label="难度选择"><button class="active" data-level="0">萌芽 4 对</button><button data-level="1">开花 6 对</button><button data-level="2">盛放 8 对</button></div>
      </section>
      <section class="game">
        <aside class="side"><div class="mascot"><span class="bee">🐝</span></div><h2>小蜜蜂的提示</h2><p>可以从任意一边开始。选错不会扣分，只会轻轻提醒你再试一次。</p><div class="mini"><div><span>本关词义</span><b id="pairTotalSide">4 对</b></div><div><span>难度变化</span><b>词数 + 记忆</b></div><div><span>输入方式</span><b>鼠标 / 触控</b></div></div></aside>
        <div class="board">
          <div class="hud"><div class="progress"><i id="progress"></i></div><div class="status" id="status" role="status" aria-live="polite">选择一张英文卡开始吧</div><div class="count"><span id="matched">0</span> / <span id="total">4</span> 朵花</div></div>
          <div class="columns"><div class="column"><h3>ENGLISH 英文</h3><div class="cards" id="englishCards"></div></div><div class="garden-path" aria-hidden="true"><span>🌱</span><i></i><i></i><i></i><span>🌼</span><i></i><i></i><span>🌻</span></div><div class="column"><h3>中文 MEANING</h3><div class="cards" id="chineseCards"></div></div></div>
          <div class="footer"><span class="tip">难度递进：4 对无计时 → 6 对相近主题 → 8 对限时与错词复习</span><button class="next" id="next" disabled>进入下一关 →</button></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const pool=[['teacher','老师'],['school','学校'],['friend','朋友'],['window','窗户'],['morning','早晨'],['yellow','黄色'],['rabbit','兔子'],['library','图书馆']];
    const levels=[4,6,8]; let level=0, first=null, matched=0, locked=false;
    const english=document.querySelector('#englishCards'), chinese=document.querySelector('#chineseCards'), status=document.querySelector('#status'), progress=document.querySelector('#progress'), next=document.querySelector('#next');
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);
    function render(){ first=null; matched=0; locked=false; const pairs=pool.slice(0,levels[level]); english.innerHTML=pairs.map(([en],i)=>`<button class="word-card" data-side="en" data-id="${i}">${en}</button>`).join(''); chinese.innerHTML=shuffle(pairs.map(([en,cn],i)=>({cn,i}))).map(({cn,i})=>`<button class="word-card cn" data-side="cn" data-id="${i}">${cn}</button>`).join(''); document.querySelector('#total').textContent=levels[level]; document.querySelector('#pairTotalSide').textContent=levels[level]+' 对'; document.querySelector('#matched').textContent=0; progress.style.width='0%'; next.disabled=true; status.textContent='选择一张英文卡开始吧'; document.querySelectorAll('.level-pills button').forEach((b,i)=>b.classList.toggle('active',i===level)); }
    function select(card){ if(locked||card.classList.contains('matched'))return; if(first===card){card.classList.remove('selected');first=null;return} card.classList.add('selected'); if(!first){first=card;status.textContent=card.dataset.side==='en'?'再找出它的中文意思':'再找出对应的英文单词';return} if(first.dataset.side===card.dataset.side){first.classList.remove('selected');first=card;status.textContent='请选择另一列的卡片';return} locked=true; const a=first; if(a.dataset.id===card.dataset.id){status.textContent='配对成功！花园开花啦 🌼';setTimeout(()=>{a.classList.add('matched');card.classList.add('matched');matched++;document.querySelector('#matched').textContent=matched;progress.style.width=(matched/levels[level]*100)+'%';first=null;locked=false;if(matched===levels[level]){status.textContent='本关完成！你让花园盛开了';next.disabled=level===levels.length-1;}},320)}else{a.classList.add('wrong');card.classList.add('wrong');status.textContent='还不是这一对，换一张试试';setTimeout(()=>{a.classList.remove('selected','wrong');card.classList.remove('selected','wrong');first=null;locked=false},500)}}
    document.querySelector('.board').addEventListener('click',e=>{const card=e.target.closest('.word-card');if(card)select(card)}); document.querySelectorAll('.level-pills button').forEach((b,i)=>b.onclick=()=>{level=i;render()}); next.onclick=()=>{if(level<2){level++;render()}}; render();
  </script>
</body>
</html>
