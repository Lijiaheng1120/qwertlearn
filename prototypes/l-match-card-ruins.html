<!doctype html>

<head>

  <title>QwertLearn 连连看原型 C · 词卡秘境</title>
  <style>
    :root{--ink:#382d35;--muted:#7b6f76;--paper:#fffaf0;--sand:#f1d89a;--orange:#f47c55;--purple:#795fc5;--teal:#3ea99f;--yellow:#ffda63}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 20%,rgba(255,255,255,.55),transparent 20%),linear-gradient(145deg,#ffe8b4,#f8bd84 52%,#c68173);overflow-x:hidden}button,a{font:inherit}.app{min-height:100vh;padding:18px 28px 30px}.topbar{max-width:1280px;min-height:68px;margin:auto;padding:10px 14px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:2px solid rgba(72,47,43,.12);border-radius:22px;background:rgba(255,250,240,.93);box-shadow:0 15px 40px rgba(92,49,37,.14);position:relative;z-index:3}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;color:#fff;background:var(--purple);font-size:23px}.switch{display:flex;gap:5px;padding:5px;border-radius:15px;background:#f1e8d7}.switch a{padding:8px 12px;border-radius:11px;color:#82746b;text-decoration:none;font-size:12px;font-weight:850}.switch a.active{color:#fff;background:var(--orange)}.close{border:0;border-radius:13px;padding:10px 14px;background:#f4eadd;font-weight:850}main{max-width:1160px;margin:18px auto 0;position:relative}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:13px}.eyebrow{margin:0 0 4px;color:#8a3f30;font-size:12px;font-weight:900;letter-spacing:1.5px}h1{margin:0;font-size:clamp(29px,4vw,43px);line-height:1.05;letter-spacing:-1.5px}.hero p:last-child{margin:8px 0 0;color:#6f5750;font-weight:650}.stats{display:flex;gap:8px}.stats div{min-width:94px;padding:9px 12px;border:2px solid rgba(72,47,43,.09);border-radius:15px;background:rgba(255,250,240,.86);font-size:11px;color:#806c64}.stats b{display:block;margin-top:2px;color:var(--ink);font-size:18px}.game{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px}.board-shell{min-height:610px;padding:18px;border:3px solid rgba(91,57,45,.15);border-radius:31px;background:linear-gradient(145deg,#a96f5f,#79505b);box-shadow:0 24px 55px rgba(98,48,40,.24);position:relative;overflow:hidden}.ruin{position:absolute;inset:auto 0 0;height:130px;opacity:.28;background:linear-gradient(90deg,transparent 4%,#f6cf8b 4% 11%,transparent 11% 18%,#f6cf8b 18% 25%,transparent 25% 74%,#f6cf8b 74% 83%,transparent 83%);clip-path:polygon(0 35%,100% 10%,100% 100%,0 100%)}.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}.stage{padding:9px 13px;border-radius:999px;color:#4d3032;background:var(--yellow);font-size:12px;font-weight:950}.status{flex:1;text-align:center;color:#fff5e7;font-size:13px;font-weight:850}.combo{color:#fff;font-size:13px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:680px;margin:28px auto 0;position:relative;z-index:2}.tile{aspect-ratio:1.4;min-height:77px;padding:10px;border:3px solid rgba(255,255,255,.72);border-radius:19px;color:#49323a;background:linear-gradient(145deg,#fff9e8,#f6dba2);box-shadow:0 8px 0 #593c49,0 12px 20px rgba(32,17,25,.25);font-size:18px;font-weight:950;cursor:pointer;transition:transform .16s,opacity .3s}.tile.cn{color:#fff;background:linear-gradient(145deg,#58bdb1,#338f8d)}.tile:hover{transform:translateY(-3px) rotate(-1deg)}.tile.selected{outline:4px solid var(--yellow);transform:translateY(-5px)}.tile.wrong{outline:4px solid #ff907c;animation:wobble .3s}.tile.matched{pointer-events:none;opacity:0;transform:scale(.5) rotate(12deg)}@keyframes wobble{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:12px 14px;border-radius:16px;color:#fff;background:rgba(55,33,48,.45);position:relative;z-index:2}.bottom span{font-size:12px;font-weight:750}.reset{border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:9px 13px;color:white;background:rgba(255,255,255,.1);font-weight:900;cursor:pointer}.side{padding:18px;border:2px solid rgba(72,47,43,.1);border-radius:27px;background:rgba(255,250,240,.94);box-shadow:0 17px 40px rgba(92,49,37,.13)}.map{height:155px;padding:18px;border-radius:20px;background:linear-gradient(145deg,#f7dc91,#e9a46e);position:relative;overflow:hidden}.map::before{content:"";position:absolute;width:115px;height:115px;border:13px dotted rgba(110,63,50,.35);border-radius:48%;left:24px;top:17px;transform:rotate(-18deg)}.map span{position:absolute;font-size:34px}.map .start{left:23px;bottom:19px}.map .finish{right:21px;top:20px}.side h2{margin:15px 0 5px;font-size:18px}.side p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650}.levels{display:grid;gap:8px;margin-top:16px}.levels button{display:flex;align-items:center;justify-content:space-between;padding:11px;border:2px solid #eadcc8;border-radius:13px;color:#7b6a63;background:#fff9ed;font-size:12px;font-weight:900;cursor:pointer}.levels button.active{color:#fff;border-color:var(--orange);background:var(--orange)}.rule{margin-top:14px;padding:11px;border-radius:13px;background:#f4ead8;color:#7b665e;font-size:11px;line-height:1.5}.next{width:100%;margin-top:14px;padding:12px;border:0;border-radius:14px;color:white;background:var(--purple);box-shadow:0 6px 0 #56419c;font-weight:950;cursor:pointer}.next:disabled{opacity:.4}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:760px){.app{padding:10px}.topbar{padding:9px 11px}.brand span:last-child,.close{display:none}.switch a{padding:7px 8px;font-size:10px}.hero{display:block}.stats{margin-top:12px}.game{grid-template-columns:1fr}.side{order:-1;padding:10px}.map,.side h2,.side p,.rule,.next{display:none}.levels{grid-template-columns:repeat(3,1fr);margin:0}.levels button{font-size:10px;padding:9px 5px}.board-shell{min-height:650px;padding:12px}.grid{gap:8px;margin-top:22px}.tile{min-height:66px;padding:5px;font-size:14px;border-radius:14px}.hud{flex-wrap:wrap}.status{order:3;flex-basis:100%}.bottom{gap:8px}.bottom span{font-size:10px}}
  </style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><span class="mark">🧩</span><span>QwertLearn</span></div><nav class="switch" aria-label="连连看原型切换"><a href="j-match-word-garden.html">A 词语花园</a><a href="k-match-star-bridge.html">B 星桥连线</a><a class="active" href="l-match-card-ruins.html">C 词卡秘境</a></nav><button class="close">返回冒险地图</button></header><main><section class="hero"><div><p class="eyebrow">原型 C · 混合网格 · 消除感最强</p><h1>词卡秘境消消乐</h1><p>英文和中文藏在同一块遗迹里，找出一对就能清除两块词卡。</p></div><div class="stats"><div>剩余词卡<b id="remain">8</b></div><div>移动次数<b id="moves">0</b></div></div></section><section class="game"><div class="board-shell"><span class="ruin"></span><div class="hud"><span class="stage" id="stage">遗迹 1 · 4 对</span><span class="status" id="status" role="status" aria-live="polite">点两张卡片，看看是不是一对</span><span class="combo">连消 × <b id="combo">0</b></span></div><div class="grid" id="grid"></div><div class="bottom"><span>配对成功会直接消除；配错不会扣除已完成进度。</span><button class="reset" id="reset">重新排列</button></div></div><aside class="side"><div class="map"><span class="start">🏕️</span><span class="finish">🏛️</span></div><h2>秘境路线</h2><p>所有卡片混在一起，更接近经典“连连看”。后续关卡会扩大棋盘，并加入相近词义干扰。</p><div class="levels"><button class="active" data-level="0">入口 <b>4 对</b></button><button data-level="1">回廊 <b>6 对</b></button><button data-level="2">宝库 <b>8 对</b></button></div><div class="rule">难度递进：4×2 混合网格 → 4×3 主题混合 → 4×4 限时、连续消除加分。保留鼠标、触控和键盘焦点操作。</div><button class="next" id="next" disabled>打开下一道门 →</button></aside></section></main></div><script>
const pool=[['teacher','老师'],['school','学校'],['friend','朋友'],['yellow','黄色'],['rabbit','兔子'],['library','图书馆'],['weather','天气'],['breakfast','早餐']];const counts=[4,6,8],names=['入口','回廊','宝库'];let level=0,first=null,moves=0,matched=0,combo=0,lock=false;const q=s=>document.querySelector(s),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function render(){first=null;moves=matched=combo=0;lock=false;const pairs=pool.slice(0,counts[level]),cards=[];pairs.forEach((p,i)=>{cards.push({v:p[0],i,s:'en'},{v:p[1],i,s:'cn'})});q('#grid').innerHTML=shuffle(cards).map(c=>`<button class="tile ${c.s==='cn'?'cn':''}" data-id="${c.i}">${c.v}</button>`).join('');q('#remain').textContent=counts[level]*2;q('#moves').textContent=0;q('#combo').textContent=0;q('#stage').textContent=`${names[level]} · ${counts[level]} 对`;q('#status').textContent='点两张卡片，看看是不是一对';q('#next').disabled=true;document.querySelectorAll('.levels button').forEach((b,i)=>b.classList.toggle('active',i===level))}
function pick(card){if(lock||card.classList.contains('matched'))return;if(first===card){card.classList.remove('selected');first=null;return}card.classList.add('selected');if(!first){first=card;q('#status').textContent='再选一张对应词义卡';return}lock=true;moves++;q('#moves').textContent=moves;const a=first;if(a.dataset.id===card.dataset.id){combo++;q('#combo').textContent=combo;q('#status').textContent='正确！两张词卡已消除 ✨';setTimeout(()=>{a.classList.add('matched');card.classList.add('matched');matched++;q('#remain').textContent=(counts[level]-matched)*2;first=null;lock=false;if(matched===counts[level]){q('#status').textContent='遗迹清理完成，宝箱打开了！';q('#next').disabled=level===2}},300)}else{combo=0;q('#combo').textContent=0;a.classList.add('wrong');card.classList.add('wrong');q('#status').textContent='词义不同，记住位置再试一次';setTimeout(()=>{a.classList.remove('selected','wrong');card.classList.remove('selected','wrong');first=null;lock=false},500)}}
q('#grid').onclick=e=>{const c=e.target.closest('.tile');if(c)pick(c)};q('#reset').onclick=render;document.querySelectorAll('.levels button').forEach((b,i)=>b.onclick=()=>{level=i;render()});q('#next').onclick=()=>{if(level<2){level++;render()}};render();</script></body></html>
